name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check deploy secrets
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PASS: ${{ secrets.SSH_PASS }}
        SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
      run: |
        missing=""
        [ -z "$SSH_HOST" ] && missing="$missing SSH_HOST"
        [ -z "$SSH_USER" ] && missing="$missing SSH_USER"
        [ -z "$SSH_PASS" ] && missing="$missing SSH_PASS"
        [ -z "$SSH_REMOTE_PATH" ] && missing="$missing SSH_REMOTE_PATH"
        if [ -n "$missing" ]; then
          echo "::error::Missing or empty GitHub Actions secrets:$missing"
          echo "Add them in: Repository -> Settings -> Secrets and variables -> Actions"
          exit 1
        fi
        echo "Required secrets are set."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "18"
        cache: "npm"

    - name: Install dependencies
      run: |
        npm ci
        cd app/api && npm ci

    - name: Build application
      run: |
        npm run build:site
        npm run install:prod

    - name: Create deployment package
      run: |
        mkdir -p deploy-package
        cp -r dist deploy-package/
        cp -r app deploy-package/
        cp -r img deploy-package/
        cp -r css deploy-package/
        cp -r js deploy-package/
        cp -r shared deploy-package/
        cp -r components deploy-package/
        cp -r locales deploy-package/
        cp -r pages deploy-package/
        cp .env.example deploy-package/.env
        cp .htaccess deploy-package/.htaccess

    - name: Install deploy tools
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass rsync

    - name: Deploy to server
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PASS: ${{ secrets.SSH_PASS }}
        SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
      run: |
        sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
          "mkdir -p '$SSH_REMOTE_PATH' && cp -r '$SSH_REMOTE_PATH' '${SSH_REMOTE_PATH}.backup.$(date +%Y%m%d_%H%M%S)' 2>/dev/null || true"

        # Shared hosting often forbids changing owner/perms/timestamps.
        # Keep delete for sync accuracy, but protect host-managed folders.
        sshpass -p "$SSH_PASS" rsync -rlvz --delete --omit-dir-times \
          --no-perms --no-owner --no-group \
          --exclude ".well-known/" \
          --exclude "ssl/" \
          --exclude ".cache/" \
          -e "ssh -o StrictHostKeyChecking=no" \
          deploy-package/ "$SSH_USER@$SSH_HOST:$SSH_REMOTE_PATH/"

        sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
          "cd '$SSH_REMOTE_PATH' && cp -n .env.example .env || true"

    - name: Health check
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
      run: |
        sleep 10
        HTTPS_URL="https://$SSH_HOST"
        HTTP_URL="http://$SSH_HOST"
        echo "Checking $HTTPS_URL (fallback $HTTP_URL) ..."

        if curl -f --retry 2 --connect-timeout 10 --max-time 20 "$HTTPS_URL/" \
          && curl -f --retry 2 --connect-timeout 10 --max-time 20 "$HTTPS_URL/applications/"; then
          echo "Health check passed via HTTPS."
          exit 0
        fi

        if curl -f --retry 2 --connect-timeout 10 --max-time 20 "$HTTP_URL/" \
          && curl -f --retry 2 --connect-timeout 10 --max-time 20 "$HTTP_URL/applications/"; then
          echo "Health check passed via HTTP."
          exit 0
        fi

        echo "::warning::Health check failed for both HTTPS and HTTP. Deployment files were uploaded, but endpoint check did not pass."
        exit 0

    - name: Cleanup
      if: always()
      run: rm -rf deploy-package
