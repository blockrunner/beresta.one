name: Deploy to Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment or read-only hosting inspection
        type: choice
        default: deploy
        options:
          - deploy
          - inspect

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspect'
    runs-on: ubuntu-latest
    steps:
    - name: Inspect hosting capabilities
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PASS: ${{ secrets.SSH_PASS }}
        SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y sshpass
        sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
          "cd '$SSH_REMOTE_PATH' && printf 'HOSTING_INSPECTION\\n' && pwd && (command -v node || true) && (node --version || true) && (command -v php || true) && (php --version | head -1 || true) && (command -v pm2 || true) && (command -v passenger-config || true) && if [ -f .env ]; then printf 'ENV_EXISTS\\n'; fi && ls -d app/api 2>/dev/null"

  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'inspect'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check deploy secrets
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PASS: ${{ secrets.SSH_PASS }}
        SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
      run: |
        missing=""
        [ -z "$SSH_HOST" ] && missing="$missing SSH_HOST"
        [ -z "$SSH_USER" ] && missing="$missing SSH_USER"
        [ -z "$SSH_PASS" ] && missing="$missing SSH_PASS"
        [ -z "$SSH_REMOTE_PATH" ] && missing="$missing SSH_REMOTE_PATH"
        if [ -n "$missing" ]; then
          echo "::error::Missing or empty GitHub Actions secrets:$missing"
          echo "Add them in: Repository -> Settings -> Secrets and variables -> Actions"
          exit 1
        fi
        echo "Required secrets are set."

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"

    - name: Install dependencies
      run: |
        npm ci
        cd app/api && npm ci

    - name: Build application
      run: |
        npm run build:site
        npm test
        npm run install:prod

    - name: Validate hosting PHP handler
      run: php -l api/participation.php

    - name: Create deployment package
      run: |
        mkdir -p deploy-package
        cp index.html deploy-package/
        cp 404.html deploy-package/
        cp -r dist deploy-package/
        cp -r app deploy-package/
        cp -r img deploy-package/
        cp -r css deploy-package/
        cp -r js deploy-package/
        cp -r shared deploy-package/
        cp -r components deploy-package/
        cp -r locales deploy-package/
        cp -r pages deploy-package/
        cp -r api deploy-package/
        cp robots.txt sitemap.xml deploy-package/
        cp .env.example deploy-package/.env.example
        cp .htaccess deploy-package/.htaccess

    - name: Install deploy tools
      run: |
        sudo apt-get update
        sudo apt-get install -y sshpass rsync

    - name: Deploy to server
      env:
        SSH_HOST: ${{ secrets.SSH_HOST }}
        SSH_USER: ${{ secrets.SSH_USER }}
        SSH_PASS: ${{ secrets.SSH_PASS }}
        SSH_REMOTE_PATH: ${{ secrets.SSH_REMOTE_PATH }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_LEAD_CHAT_ID: ${{ secrets.TELEGRAM_LEAD_CHAT_ID }}
      run: |
        test -n "$TELEGRAM_BOT_TOKEN" && test -n "$TELEGRAM_LEAD_CHAT_ID"
        umask 077
        printf 'TELEGRAM_BOT_TOKEN=%s\nTELEGRAM_LEAD_CHAT_ID=%s\n' "$TELEGRAM_BOT_TOKEN" "$TELEGRAM_LEAD_CHAT_ID" > "$RUNNER_TEMP/beresta-telegram.env"
        sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
          "cd '$SSH_REMOTE_PATH' && umask 077 && mkdir -p ../.beresta-private && cat > ../.beresta-private/telegram.env && chmod 600 ../.beresta-private/telegram.env" < "$RUNNER_TEMP/beresta-telegram.env"

        sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
          "mkdir -p '$SSH_REMOTE_PATH' && cp -r '$SSH_REMOTE_PATH' '${SSH_REMOTE_PATH}.backup.$(date +%Y%m%d_%H%M%S)' 2>/dev/null || true"

        # Shared hosting often forbids changing owner/perms/timestamps.
        # Keep delete for sync accuracy, but protect host-managed folders.
        sshpass -p "$SSH_PASS" rsync -rlvz --delete --omit-dir-times \
          --no-perms --no-owner --no-group \
          --exclude ".well-known/" \
          --exclude "ssl/" \
          --exclude ".cache/" \
          --exclude ".env" \
          --exclude "app/api/data/" \
          -e "ssh -o StrictHostKeyChecking=no" \
          deploy-package/ "$SSH_USER@$SSH_HOST:$SSH_REMOTE_PATH/"

        sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
          "cd '$SSH_REMOTE_PATH' && cp -n .env.example .env || true"

    - name: Health check
      run: |
        sleep 10
        node scripts/check-site.cjs https://beresta.one

    - name: Cleanup
      if: always()
      run: rm -rf deploy-package
